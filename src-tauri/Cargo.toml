[package]
name = "novel-editor"
version = "0.1.0"
description = "A focused text editor for novel writing"
authors = ["Novel Editor"]
edition = "2021"
license = "MIT"
repository = "https://github.com/seha9876/novelEditor"

[lib]
name = "novel_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rusqlite = { version = "0.40.0", default-features = false, features = ["backup", "bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-store = "2"
