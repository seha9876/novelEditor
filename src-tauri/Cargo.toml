[package]
name = "novel-editor"
version = "0.1.0"
description = "A focused text editor for novel writing"
authors = ["Novel Editor"]
edition = "2021"

[lib]
name = "novel_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
